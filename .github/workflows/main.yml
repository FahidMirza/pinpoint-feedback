name: Keep Supabase awake

# The first version made an empty read, and Supabase paused the project anyway.
# This one writes a timestamp every day, which counts as real database work.

on:
  schedule:
    - cron: "0 6 * * *" # daily, 06:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Write a heartbeat
        env:
          SUPABASE_URL: https://qvzkiglgnqyeqlpvjntf.supabase.co
          SUPABASE_ANON_KEY: eyJhbGci••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••
        run: |
          set -euo pipefail

          response=$(curl -sS -w '\n%{http_code}' -X POST \
            "$SUPABASE_URL/rest/v1/rpc/pinpoint_heartbeat" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')

          code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n1)
          echo "HTTP $code — heartbeat at $body"

          if [ "$code" != "200" ]; then
            echo "::error::Heartbeat failed ($code). The project may be paused — resume it in Supabase."
            exit 1
          fi

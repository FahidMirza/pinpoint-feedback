name: Keep Supabase awake

# Writes a timestamp every day so Supabase counts the project as active.
# The key comes from the SUPABASE_ANON_KEY repository secret.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Write a heartbeat
        env:
          SUPABASE_URL: https://qvzkiglgnqyeqlpvjntf.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::The SUPABASE_ANON_KEY repository secret is missing."
            exit 1
          fi

          response=$(curl -sS -w '\n%{http_code}' -X POST \
            "$SUPABASE_URL/rest/v1/rpc/pinpoint_heartbeat" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')

          code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n1)
          echo "HTTP $code — heartbeat at $body"

          if [ "$code" != "200" ]; then
            echo "::error::Heartbeat failed ($code). The project may be paused — resume it in Supabase."
            exit 1
          fi
